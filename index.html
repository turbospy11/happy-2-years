<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>i am a website</title>

        <link rel="stylesheet" href="style.css"/>
    </head>

    <body>
        <header></header> 
        <main class="home">
            <h1><span class="title-happy">Happy<img src="images/fish.png" alt="Fish" /></span> Anniversary <span class="title-name">Luke<img src="images/pink.png" alt="Pink heart" /></span></h1>
            <p>Love, robot Harriet</p>

            <section class="envelope-grid">
                <a href="letter.html?letter=miss-you" class="envelope">
                    <img src="images/miss-you.png" alt="open me" />
                    <p>open me</p>
                </a>
            </section>
        </main>
        <footer>
            <div class="box1">
                <img src="images/dance1.gif" alt="Dance animation 1" />
            </div>
            <div class="box2">
                <img src="images/dance2.gif" alt="Dance animation 2" />
            </div>
            <div class="box3">
                <img src="images/dance3.gif" alt="Dance animation 3" />
            </div>
            <img src="images/wiz.png" alt="Wizard" class="stressed-wiz" />
        </footer>
        <section class="envelope-grid new-letters">
            <a href="letter.html?letter=sad" class="envelope">
                <img src="images/storm.png" alt="Open when sad" />
                <p><span class="sad-open">open<img src="images/daisy.png" alt="Daisy" /></span> when sad</p>
            </a>
            <a href="letter.html?letter=stressed" class="envelope stressed-envelope">
                <img src="images/firework.png" alt="Open when stressed" />
                <p>open when stressed</p>
            </a>
            <img src="images/orange.png" alt="Orange heart" class="between-labels" />
        </section>
        <img
            src="images/penguin.png"
            alt="A penguin that runs away from the cursor"
            class="runaway-penguin"
        />
        <script src="penguin.js"></script>
    </body>

</html>
